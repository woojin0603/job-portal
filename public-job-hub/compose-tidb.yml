services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: mysql,prod
      MYSQL_URL: ${MYSQL_URL:?Set MYSQL_URL in .env}
      MYSQL_USERNAME: ${MYSQL_USERNAME:?Set MYSQL_USERNAME in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_MAX_POOL_SIZE: ${MYSQL_MAX_POOL_SIZE:-4}
      MYSQL_MIN_IDLE: ${MYSQL_MIN_IDLE:-1}
      MYSQL_MAX_LIFETIME_MS: ${MYSQL_MAX_LIFETIME_MS:-300000}
      JOBHUB_DDL_AUTO: ${JOBHUB_DDL_AUTO:-validate}
      JOBHUB_ADMIN_USERNAME: ${JOBHUB_ADMIN_USERNAME:-}
      JOBHUB_ADMIN_PASSWORD: ${JOBHUB_ADMIN_PASSWORD:-}
      JOBHUB_ADMIN_EMAILS: ${JOBHUB_ADMIN_EMAILS:-}
      JOBHUB_PUBLIC_URL: ${JOBHUB_PUBLIC_URL:-https://public-job-hub.duckdns.org}
      JOBHUB_PASSWORD_RESET_MAIL_ENABLED: ${JOBHUB_PASSWORD_RESET_MAIL_ENABLED:-false}
      JOBHUB_MAIL_FROM: ${JOBHUB_MAIL_FROM:-no-reply@localhost}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      JOBHUB_PUBLIC_DATA_ENABLED: ${JOBHUB_PUBLIC_DATA_ENABLED:-true}
      JOBHUB_PUBLIC_DATA_API_KEY: ${JOBHUB_PUBLIC_DATA_API_KEY:-}
      JOBHUB_CRAWL_SOURCES: ${JOBHUB_CRAWL_SOURCES:-JOB-ALIO|https://job.alio.go.kr/recruit.do?order=REG_DATE&pageNo=1|PUBLIC|TABLE|CENTRAL_PUBLIC}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JOBHUB_PAID_AI_ENABLED: ${JOBHUB_PAID_AI_ENABLED:-false}
      JOBHUB_OCR_ENABLED: ${JOBHUB_OCR_ENABLED:-false}
      JOBHUB_OPERATIONS_STATUS_DIR: /var/lib/jobhub-operations
      TZ: Asia/Seoul
    expose:
      - "8080"
    mem_limit: 640m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp:size=96m,mode=1777
    volumes:
      - ./backups/monitor-state:/var/lib/jobhub-operations:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 90s
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      JOBHUB_DOMAIN: ${JOBHUB_DOMAIN:?Set JOBHUB_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

volumes:
  caddy-data:
  caddy-config:

networks:
  web:
