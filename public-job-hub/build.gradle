// Java 21 기반 Spring Boot API 서버의 빌드 플러그인을 선언한다.
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.co.jobhub'
version = '0.1.0'

// 로컬 JDK가 여러 개여도 컴파일과 실행에 Java 21 툴체인을 사용한다.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Spring Boot, 보안, DB, HTML 파싱 라이브러리를 중앙 저장소에서 가져온다.
repositories {
    mavenCentral()
}

// 웹 API와 인증·영속성 기능 및 검증용 테스트 의존성을 분리한다.
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

// JUnit 5 기반 테스트를 Gradle test 작업에서 실행한다.
tasks.named('test') {
    useJUnitPlatform()
}

// Windows/OneDrive에서 javac가 의존성 JAR을 닫을 때 발생하는 파일 잠금이 Gradle 프로세스에 전파되지 않게 한다.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.fork = true
    options.forkOptions.executable = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
    }.get().executablePath.asFile.absolutePath
}

// 배포용 JAR에 설치 가능한 React 화면과 서비스 워커를 함께 담는다.
// 처음 실행 전 frontend 폴더에서 npm install을 한 번 수행해야 한다.
tasks.register('buildFrontend', Exec) {
    workingDir = file('frontend')
    commandLine(System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm', 'run', 'build')
}

tasks.named('bootJar') {
    dependsOn tasks.named('buildFrontend')
    from('frontend/dist') {
        into('BOOT-INF/classes/static')
    }
}

// 개발용 bootRun에서도 React를 먼저 빌드하고 dist를 정적 파일 루트로 제공한다.
tasks.named('bootRun') {
    dependsOn tasks.named('buildFrontend')
    systemProperty 'spring.web.resources.static-locations',
            "file:${file('frontend/dist').absolutePath.replace('\\', '/')}/,classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/"
}
