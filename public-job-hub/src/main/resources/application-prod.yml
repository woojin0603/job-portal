# HTTPS 리버스 프록시 뒤 운영 환경에서 --spring.profiles.active=mysql,prod 로 함께 활성화한다.
server:
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false
    hibernate:
      # 운영 DB는 기본적으로 스키마를 검증만 한다. 구조 변경이 필요한 배포에서만 명시적으로 update를 사용한다.
      ddl-auto: ${JOBHUB_DDL_AUTO:validate}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: true
jobhub:
  admin:
    username: ${JOBHUB_ADMIN_USERNAME}
    password: ${JOBHUB_ADMIN_PASSWORD}
