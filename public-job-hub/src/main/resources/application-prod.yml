# HTTPS 리버스 프록시 뒤 운영 환경에서 --spring.profiles.active=mysql,prod 로 함께 활성화한다.
server:
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false
jobhub:
  admin:
    username: ${JOBHUB_ADMIN_USERNAME}
    password: ${JOBHUB_ADMIN_PASSWORD}
