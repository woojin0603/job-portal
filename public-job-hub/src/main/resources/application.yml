# H2 파일 DB와 JPA 설정. 데이터 파일은 프로젝트의 data 폴더에 유지한다.
spring:
  # IntelliJ에서 JobHubApplication을 직접 실행해도 최신 React 빌드 결과를 제공한다.
  web:
    resources:
      static-locations: file:./frontend/dist/,classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/
  # 서비스 재시작 후에도 공고·회원·스크랩을 유지할 로컬 H2 파일 DB.
  datasource:
    url: jdbc:h2:file:./data/jobhub;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
  # 현재 초안에서는 엔티티 변경에 따라 테이블을 자동 갱신한다.
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  # 운영용 API 서버에서는 내장 H2 관리 콘솔을 열지 않는다.
  h2:
    console:
      enabled: false
      path: /h2-console
# 외부 공고 수집과 AI 보완 추출에 사용하는 서비스 전용 설정.
# OpenAI 키는 파일에 넣지 않고 환경 변수 OPENAI_API_KEY에서 읽는다.
jobhub:
  public-data:
    recruitment:
      # 인증키가 있으면 별도의 활성화 환경변수 없이 채용정보를 갱신한다.
      enabled: ${JOBHUB_PUBLIC_DATA_ENABLED:true}
      base-url: https://apis.data.go.kr/1051000/recruitment
      service-key: ${JOBHUB_PUBLIC_DATA_API_KEY:}
      # 진행 중 공고는 마지막 페이지까지 읽되 종료 공고 조회를 포함한 일일 호출량 보호를 위해 최대 7페이지로 제한한다.
      max-pages: ${JOBHUB_PUBLIC_DATA_MAX_PAGES:7}
      # 최근 종료 공고를 캐시해 이전 2개년 경쟁률 비교에 사용한다. 최초 수집 뒤에는 저장된 공고를 재호출하지 않는다.
      history-pages: ${JOBHUB_PUBLIC_DATA_HISTORY_PAGES:2}
      rows: ${JOBHUB_PUBLIC_DATA_ROWS:100}
      request-delay-millis: ${JOBHUB_PUBLIC_DATA_DELAY_MILLIS:250}
  # 쉼표로 구분한 이메일만 관리자 검수 API에 접근할 수 있다.
  admin:
    emails: ${JOBHUB_ADMIN_EMAILS:}
    username: ${JOBHUB_ADMIN_USERNAME:admin}
    password: ${JOBHUB_ADMIN_PASSWORD:admin1234!}
  security:
    login-max-failures: ${JOBHUB_LOGIN_MAX_FAILURES:5}
    login-window-minutes: ${JOBHUB_LOGIN_WINDOW_MINUTES:15}
  # 실제 사이트 목록을 읽는 예약 작업의 활성화 여부와 기본 출처.
  crawl:
    enabled: ${JOBHUB_CRAWL_ENABLED:true}
    pages: ${JOBHUB_CRAWL_PAGES:2}
    request-delay-millis: ${JOBHUB_CRAWL_DELAY_MILLIS:1500}
    # NAME|목록 URL|PUBLIC/PRIVATE|TABLE/AI/AUTO|CENTRAL_PUBLIC/LOCAL_PUBLIC 형식이다.
    # AI 출처는 robots.txt와 사이트 이용조건이 허용하는 공개 목록 URL만 등록한다.
    sources: '${JOBHUB_CRAWL_SOURCES:JOB-ALIO|https://job.alio.go.kr/recruit.do?order=REG_DATE&pageNo=1|PUBLIC|TABLE|CENTRAL_PUBLIC}'
  # HTML 표를 파싱하지 못한 경우에만 사용하는 선택적 AI 보완 추출.
  ai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
    # API 키가 컴퓨터에 남아 있어도 이 값을 true로 바꾸기 전에는 유료 AI 요청을 보내지 않는다.
    paid-features-enabled: ${JOBHUB_PAID_AI_ENABLED:false}
    # 이미지형 PDF OCR은 API 비용이 발생하므로 환경 변수로 명시적으로 켠다.
    ocr-enabled: ${JOBHUB_OCR_ENABLED:false}
    ocr-max-pages: ${JOBHUB_OCR_MAX_PAGES:3}
